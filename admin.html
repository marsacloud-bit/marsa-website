<!DOCTYPE html>
<html lang="ar" dir="rtl" class="no-js" data-i18n-page>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة الموظفين | مرسى MARSA</title>
  <meta name="description" content="لوحة موظفي مرسى (بيئة تجريبية): الطلبات الواردة، المعاملات وحالاتها التشغيلية، الحاويات وإثبات إرجاع الفارغ، المستندات، العملاء ورسائل التواصل.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B3A6E">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- theme: set data-theme before first paint (light / dark / system, localStorage marsa_theme) -->
  <script>(function(){try{var t=localStorage.getItem('marsa_theme');if(t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <!-- i18n: set lang/dir before first paint (same rule as assets/js/i18n.js; it stays authoritative) -->
  <script>(function(){try{if(localStorage.getItem('marsa_lang')==='en'){var h=document.documentElement;h.setAttribute('lang','en');h.setAttribute('dir','ltr');}}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages/admin.css">
</head>
<body class="app-page" data-app-page="admin">
  <!-- The app shell (assets/js/app-shell.js) builds the sidebar, topbar, org switcher and
       user menu around #app-main. admin.js renders the gate or the current view inside it. -->
  <main id="app-main" class="adm-main" tabindex="-1">
    <div class="adm-gate app-card" id="adm-gate" aria-live="polite">
      <div class="adm-gate-body" id="adm-gate-body">
        <p class="text-muted" data-i18n="admin.gate_checking">جارٍ التحقق من الجلسة…</p>
      </div>
    </div>

    <div class="adm-app" id="adm-app" hidden>
      <div class="adm-view" id="adm-view" tabindex="-1"></div>
    </div>
  </main>

  <dialog class="adm-dialog" id="adm-dialog" aria-labelledby="adm-dialog-title">
    <form class="adm-dialog-form" id="adm-dialog-form" method="dialog" novalidate>
      <div class="adm-dialog-head">
        <h2 id="adm-dialog-title">—</h2>
        <button class="adm-dialog-x" type="button" value="cancel" data-dialog-cancel aria-label="إغلاق" data-i18n-attr="aria-label:admin.dialog_close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="adm-dialog-body" id="adm-dialog-body"></div>
      <p class="form-error adm-dialog-error" id="adm-dialog-error" role="alert" hidden></p>
      <div class="adm-dialog-foot">
        <button class="btn btn-ghost" type="button" data-dialog-cancel data-i18n="admin.cancel">إلغاء</button>
        <button class="btn btn-primary" type="submit" id="adm-dialog-submit">حفظ</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/i18n/admin.js" defer></script>
  <script src="assets/i18n/app.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/supa.js" defer></script>
  <script src="assets/js/app-shell.js" defer></script>
  <script src="assets/js/pwa.js" defer></script>
  <script src="assets/js/admin.js" defer></script>
</body>
</html>
