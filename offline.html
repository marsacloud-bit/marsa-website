<!DOCTYPE html>
<html lang="ar" dir="rtl" data-i18n-page>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>غير متصل | مرسى MARSA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B3A6E">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- i18n: set lang/dir before first paint (same rule as assets/js/i18n.js; it stays authoritative) -->
  <script>(function(){try{if(localStorage.getItem('marsa_lang')==='en'){var h=document.documentElement;h.setAttribute('lang','en');h.setAttribute('dir','ltr');}}catch(e){}})();</script>
  <!-- Served by sw.js for any navigation while offline: only precached files, no web fonts required
       (Cairo is used when the browser already has it). The few inline rules keep the card readable
       even if style.css is missing from the cache. -->
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { margin: 0; background: #F4F8FB; color: #0F1E33; font-family: "Cairo", "Segoe UI", Tahoma, "Geeza Pro", sans-serif; }
    .offline-page { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box; }
    .offline-card { width: 100%; max-width: 480px; text-align: center; box-sizing: border-box; }
    .offline-logo { margin: 0 auto 22px; width: 107px; height: auto; }
    .offline-card .icon-box { margin: 0 auto 18px; }
    .offline-card h1 { font-size: var(--fs-xl, 1.75rem); margin: 0 0 10px; }
    .offline-card p { margin: 0 0 22px; }
    .offline-card .btn-group { justify-content: center; }
    .offline-status { margin: 20px 0 0 !important; font-size: var(--fs-xs, .8125rem); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .offline-status .dot { color: var(--warning, #C98A0B); }
    .offline-status .dot.is-online { color: var(--success, #13955F); }
    .offline-pwa:empty, .offline-pwa[hidden] { display: none; }
    .offline-pwa { display: flex; justify-content: center; margin-top: 14px; }
  </style>
</head>
<body data-page="offline">
  <main class="offline-page" id="main">
    <section class="card offline-card" aria-labelledby="offline-title">
      <img class="offline-logo" src="assets/img/logo-header.png" alt="مرسى MARSA" width="107" height="74" data-i18n-attr="alt:offline.logoAlt">
      <span class="icon-box icon-box-soft" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5a15 15 0 0 1 11.3 3.8M5 12.6a10 10 0 0 1 5.2-2.5M16.8 10.9A10 10 0 0 1 19 12.6M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
      </span>
      <h1 id="offline-title" data-i18n="offline.title">أنت غير متصل بالإنترنت</h1>
      <p class="text-muted" data-i18n="offline.text">تعذّر تحميل هذه الصفحة لأن الجهاز غير متصل. تحقّق من اتصالك ثم أعد المحاولة. لا تُحفظ أي بيانات تشغيلية على هذا الجهاز، لذلك تحتاج المنصة إلى اتصال لعرض الطلبات والمعاملات.</p>
      <div class="btn-group">
        <button class="btn btn-primary" type="button" data-offline-retry data-i18n="offline.retry">إعادة المحاولة</button>
        <a class="btn btn-ghost" href="login.html" data-i18n="offline.home">صفحة الدخول</a>
      </div>
      <p class="offline-status text-muted" role="status" aria-live="polite"><span class="dot" data-offline-dot aria-hidden="true"></span><span data-offline-status data-i18n="offline.waiting">بانتظار عودة الاتصال…</span></p>
      <div class="offline-pwa" data-pwa-install hidden></div>
    </section>
  </main>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/pwa.js" defer></script>
  <script>
    /* offline page: dictionary + retry. Inline so it needs no extra file; runs after the deferred
       scripts (DOMContentLoaded) and also works when none of them loaded. */
    document.addEventListener('DOMContentLoaded', function () {
      var I = window.MarsaI18n;
      var STR = {
        ar: { title: 'أنت غير متصل بالإنترنت', text: 'تعذّر تحميل هذه الصفحة لأن الجهاز غير متصل. تحقّق من اتصالك ثم أعد المحاولة. لا تُحفظ أي بيانات تشغيلية على هذا الجهاز، لذلك تحتاج المنصة إلى اتصال لعرض الطلبات والمعاملات.',
              retry: 'إعادة المحاولة', home: 'صفحة الدخول', waiting: 'بانتظار عودة الاتصال…', back: 'عاد الاتصال. جارٍ إعادة التحميل…', pageTitle: 'غير متصل | مرسى MARSA', logoAlt: 'مرسى MARSA' },
        en: { title: 'You are offline', text: 'This page could not be loaded because the device is offline. Check your connection and try again. No operational data is stored on this device, so the platform needs a connection to show requests and transactions.',
              retry: 'Try again', home: 'Sign-in page', waiting: 'Waiting for the connection…', back: 'Back online. Reloading…', pageTitle: 'Offline | MARSA', logoAlt: 'MARSA' }
      };
      if (I && I.register) { I.register('offline', STR); if (I.apply) I.apply(document); }
      function t(k) { var l = I && I.lang ? I.lang() : 'ar'; return (STR[l] || STR.ar)[k]; }
      function title() { document.title = t('pageTitle'); }
      title();
      window.addEventListener('marsa:langchange', title);
      var retry = document.querySelector('[data-offline-retry]');
      if (retry) retry.addEventListener('click', function () { location.reload(); });
      var dot = document.querySelector('[data-offline-dot]'), st = document.querySelector('[data-offline-status]');
      if (dot) dot.classList.add('dot');
      window.addEventListener('online', function () {
        if (dot) dot.classList.add('is-online');
        if (st) { st.removeAttribute('data-i18n'); st.textContent = t('back'); }
        setTimeout(function () { location.reload(); }, 800);
      });
    });
  </script>
</body>
</html>
