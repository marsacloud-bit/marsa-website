<style>
  /* All colors in one place: change --accent to re-theme the page. */
  :root {
    --accent: #5B4BA8;
    --accent-ink: #FFFFFF;
    --accent-soft: #EFECF8;
    --accent-line: #D9D3EF;
    --bg: #F8F7F4;
    --surface: #FFFFFF;
    --ink: #1F1C24;
    --muted: #67626E;
    --line: #E7E3DD;
    --deep: #26212F;
    --deep-ink: #EDEAF3;
    --deep-muted: #A9A2B6;
    /* meaning colors: fixed, never decorative */
    --ok: #1E6B34; --ok-bg: #E3F2E6;
    --review: #7A5410; --review-bg: #FBF1D9;
    --late: #9B1C24; --late-bg: #FBE4E6;
    --r: 14px; --r-lg: 22px;
    --shadow: 0 1px 2px rgba(31,28,36,.05), 0 8px 24px rgba(31,28,36,.06);
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.75; }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; }
  .wrap { width: min(1200px, 100% - 32px); margin-inline: auto; }
  .num { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); letter-spacing: .02em; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 15px; border: 1px solid transparent; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-main { background: var(--accent); color: var(--accent-ink); }
  .btn-main:hover { filter: brightness(1.08); }
  .btn-line { border-color: var(--line); background: var(--surface); }
  .btn-line:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .btn-big { padding: 14px 30px; font-size: 17px; }

  /* top strip */
  .strip { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .strip .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 38px; }
  .strip .dates { display: flex; gap: 14px; flex-wrap: wrap; }
  .strip .dates span + span::before { content: "•"; margin-inline-end: 14px; color: var(--line); }
  .lang { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font: inherit; color: var(--ink); cursor: pointer; }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(248,247,244,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 28px; min-height: 72px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  nav.main { display: flex; gap: 4px; flex: 1; }
  nav.main a { padding: 8px 12px; border-radius: 999px; font-weight: 500; font-size: 15.5px; color: var(--muted); }
  nav.main a:hover { color: var(--ink); background: var(--surface); }
  nav.main a.on { color: var(--accent); background: var(--accent-soft); }
  .auth { display: flex; gap: 8px; }
  .menu-btn { display: none; margin-inline-start: auto; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; color: var(--ink); }

  /* hero */
  .hero { padding: 72px 0 56px; }
  .hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 600; }
  h1 { font-size: clamp(32px, 2.2vw + 18px, 50px); line-height: 1.3; margin: 18px 0 14px; font-weight: 700; letter-spacing: -.01em; }
  .lead { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .track { margin-top: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); max-width: 560px; }
  .track label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 8px; }
  .track .row { display: flex; gap: 8px; }
  .track input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; font: 500 16px var(--mono); direction: ltr; text-align: start; background: var(--bg); color: var(--ink); }
  .track input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  [dir="rtl"] .track input { text-align: right; }
  .track small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 8px; }

  /* hero card: sample transaction */
  .tx { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 24px; }
  .tx-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 18px; }
  .tx-head b { display: block; font-size: 17px; }
  .tx-head .num { color: var(--muted); font-size: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .tag-ok { background: var(--ok-bg); color: var(--ok); }
  .tag-review { background: var(--review-bg); color: var(--review); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { position: relative; padding-inline-start: 34px; padding-bottom: 16px; font-size: 15.5px; }
  .steps li::before { content: ""; position: absolute; inset-inline-start: 10px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .steps .dot { position: absolute; inset-inline-start: 0; top: 4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid var(--line); }
  .steps .done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .steps .now .dot { border-color: var(--accent); background: var(--accent-soft); }
  .steps .now .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .steps small { display: block; color: var(--muted); font-size: 13.5px; }
  .steps .wait { color: var(--muted); }
  .tx-foot { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 14px; font-size: 14px; color: var(--muted); }
  .tx-foot .num { color: var(--ink); }
  .sample { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 10px; }

  /* sections */
  section.block { padding: 72px 0; }
  section.alt { background: var(--surface); border-block: 1px solid var(--line); }
  .head { max-width: 640px; margin-bottom: 36px; }
  .head h2 { font-size: clamp(26px, 1.2vw + 18px, 34px); line-height: 1.35; margin: 0 0 8px; }
  .head p { color: var(--muted); margin: 0; }
  .head-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; transition: border-color .15s, transform .15s; }
  section.alt .card { background: var(--bg); }
  .card:hover { border-color: var(--accent-line); transform: translateY(-2px); }
  .ico { width: 46px; height: 46px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 18.5px; }
  .card p { margin: 0; color: var(--muted); font-size: 15.5px; }

  .how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; counter-reset: s; }
  .how li { list-style: none; position: relative; padding: 24px; border-radius: var(--r-lg); background: var(--bg); border: 1px solid var(--line); }
  .how li::before { counter-increment: s; content: counter(s); position: absolute; inset-inline-end: 20px; top: 16px; font: 700 34px var(--font); color: var(--accent-line); }
  .how h3 { margin: 0 0 6px; font-size: 18px; }
  .how p { margin: 0; color: var(--muted); font-size: 15px; }
  .how ol { margin: 0; padding: 0; display: contents; }

  .ports { display: flex; flex-wrap: wrap; gap: 10px; }
  .port { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; font-weight: 500; }
  .port .ico { width: 30px; height: 30px; border-radius: 50%; margin: 0; }

  .post .meta { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; }
  .post .more { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 600; font-size: 15px; }

  .consult { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r-lg); padding: 36px 40px; }
  .consult h2 { margin: 0 0 6px; font-size: 28px; }
  .consult p { margin: 0; color: var(--muted); }

  /* footer */
  footer { background: var(--deep); color: var(--deep-ink); padding: 56px 0 24px; margin-top: 72px; }
  footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 32px; }
  footer h4 { margin: 0 0 12px; font-size: 15px; color: #fff; }
  footer p, footer li { color: var(--deep-muted); font-size: 15px; }
  footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  footer a:hover { color: #fff; }
  footer .brand .logo { background: #fff; color: var(--deep); }
  footer .copy { border-top: 1px solid rgba(255,255,255,.1); margin-top: 36px; padding-top: 18px; font-size: 13.5px; color: var(--deep-muted); }

  /* responsive */
  @media (max-width: 1180px) {
    nav.main a { padding: 8px 9px; font-size: 15px; }
    header.top .wrap { gap: 16px; }
  }
  @media (max-width: 1080px) {
    .menu-btn { display: block; }
    nav.main, .auth { display: none; }
    header.top.open .wrap { flex-wrap: wrap; padding-bottom: 14px; }
    header.top.open nav.main { display: flex; flex-direction: column; flex: 0 0 100%; order: 3; }
    header.top.open .auth { display: flex; width: 100%; order: 4; }
    header.top.open .auth .btn { flex: 1; justify-content: center; }
  }
  @media (max-width: 900px) {
    .hero .wrap, .consult { grid-template-columns: 1fr; }
    .hero { padding-top: 40px; }
    .grid3, .how { grid-template-columns: 1fr 1fr; }
    footer .cols { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .grid3, .how, footer .cols { grid-template-columns: 1fr; }
    .track .row { flex-direction: column; }
    .track .btn { justify-content: center; }
    .strip { font-size: 12px; }
    .strip .dates { gap: 2px 8px; }
    .strip .dates span + span::before { margin-inline-end: 8px; }
    section.block { padding: 52px 0; }
    .consult { padding: 26px; }
  }
</style>
</head>

(function () {
  var KEY = 'office_home_lang';
  var lang = 'ar';
  try { lang = localStorage.getItem(KEY) || 'ar'; } catch (e) {}

  function pick(v) { return (v && typeof v === 'object') ? (v[lang] || v.ar) : v; }
  function fmt(d, opts, cal) {
    // Western digits always (nu-latn), Hijri via Umm al-Qura.
    var loc = (lang === 'ar' ? 'ar-SA' : 'en-GB') + '-u-nu-latn' + (cal ? '-ca-' + cal : '');
    try { return new Intl.DateTimeFormat(loc, opts).format(d); } catch (e) { return d.toDateString(); }
  }

  function render() {
    var t = T[lang], html = document.documentElement;
    html.lang = lang; html.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')] || ''; });
    document.querySelectorAll('[data-office]').forEach(function (el) { el.textContent = pick(OFFICE[el.getAttribute('data-office')]); });
    document.querySelectorAll('[data-date]').forEach(function (el) {
      el.textContent = fmt(new Date(el.getAttribute('data-date') + 'T12:00:00'), { day: 'numeric', month: 'long', year: 'numeric' });
    });
    var now = new Date();
    document.getElementById('d-greg').textContent = fmt(now, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('d-hijri').textContent = fmt(now, { day: 'numeric', month: 'long', year: 'numeric' }, 'islamic-umalqura');
    document.getElementById('year').textContent = String(now.getFullYear());
    document.querySelectorAll('.flip').forEach(function (el) { el.style.transform = lang === 'ar' ? '' : 'scaleX(-1)'; });
    var list = document.getElementById('port-list');
    list.innerHTML = '';
    OFFICE.ports.forEach(function (p) {
      var s = document.createElement('span'); s.className = 'port';
      s.innerHTML = '<span class="ico"><svg width="16" height="16"><use href="#' + p.icon + '"/></svg></span>';
      s.appendChild(document.createTextNode(pick(p)));
      list.appendChild(s);
    });
    document.title = (lang === 'ar' ? 'الرئيسية — ' : 'Home — ') + pick(OFFICE.name);
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  var top = document.getElementById('top'), menu = document.getElementById('menu');
  menu.addEventListener('click', function () {
    var open = top.classList.toggle('open');
    menu.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.getElementById('nav').addEventListener('click', function (e) {
    if (e.target.tagName === 'A') { top.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); }
  });
  render();
})();
